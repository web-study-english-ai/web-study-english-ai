services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: wsea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: study_english
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d study_english']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: