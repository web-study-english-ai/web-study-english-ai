name: Seed Production Vocab 7000

on:
  workflow_dispatch:
    inputs:
      confirm_action:
        description: 'Nhập "YES" để xác nhận nâng cấp cơ sở dữ liệu Production lên 7.000 từ'
        required: true
        default: 'YES'

jobs:
  pre_backup:
    name: 1. Pre-seed Database Backup
    runs-on: ubuntu-latest

    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_action }}" != "YES" ]; then
            echo "::error::Xác nhận không hợp lệ. Vui lòng nhập 'YES' để tiến hành."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 Client Tools
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Execute Snapshot Backup
        id: run_backup
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          chmod +x ./scripts/backup-db.sh
          ./scripts/backup-db.sh

      - name: Upload Snapshot Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-seed-7000-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 14
          if-no-files-found: error

  seed_production:
    name: 2. Ingest 7,000 Vocabulary Words to Production
    needs: pre_backup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Seed 7000 Vocabulary
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npm run seed

      - name: Verify Word Count in Production Database
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          async function verify() {
            const count = await prisma.word.count();
            const topicsCount = await prisma.topic.count();
            const a1 = await prisma.word.count({ where: { cefr: 'A1' } });
            const a2 = await prisma.word.count({ where: { cefr: 'A2' } });
            const b1 = await prisma.word.count({ where: { cefr: 'B1' } });
            const b2 = await prisma.word.count({ where: { cefr: 'B2' } });
            console.log('==================================================');
            console.log('✅ KẾT QUẢ ĐỐI SOÁT SAU NẠP PRODUCTION:');
            console.log('Tổng số chủ đề (Topics):', topicsCount);
            console.log('Tổng số từ vựng (Words):', count);
            console.log(' - A1:', a1);
            console.log(' - A2:', a2);
            console.log(' - B1:', b1);
            console.log(' - B2:', b2);
            console.log('==================================================');
            if (count < 7000) {
              console.error('❌ Thất bại: Số lượng từ vựng (' + count + ') chưa đạt 7000!');
              process.exit(1);
            }
            console.log('🎉 NÂNG CẤP THÀNH CÔNG 7.000 TỪ LÊN PRODUCTION!');
            await prisma.\$disconnect();
          }
          verify();
          "
